    // Sound Effects Engine (Web Audio API)

    const SoundFX = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      play(type) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'coin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(987.77, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.07);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'danger') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.25);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.start(now);
            osc.stop(now + 0.28);
          } else if (type === 'fanfare') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.5, now + 0.3);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            osc.start(now);
            osc.stop(now + 0.55);
          }
        } catch (e) {}
      }
    };

      } catch (e) {}
    }

    function saveUnlockedEndings() {
      try {
        localStorage.setItem('siren_sim_endings_v1', JSON.stringify(state.unlockedEndings));
      } catch (e) {}
    }

    function initGame() {
      loadUnlockedEndings();

    // ==========================================
    // Helper Functions
    // ==========================================
    function getBoy(id) {
      return state.boys.find(b => b.id === id);
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function showPhoneToast(title, body, isDanger = false) {
      const container = document.getElementById('phoneToastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast-anim rounded-2xl p-3 shadow-xl border backdrop-blur-md flex items-start gap-2.5 ${
        isDanger
          ? 'bg-rose-950/95 border-rose-500 text-rose-100'
          : 'bg-slate-900/95 border-pink-500/50 text-slate-100'
      }`;
      toast.innerHTML = `
        <div class="text-lg leading-none mt-0.5">${isDanger ? '🚨' : '📲'}</div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold truncate">${title}</div>
          <div class="text-[11px] text-slate-300 line-clamp-2 mt-0.5">${body}</div>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 3600);
    }

    function checkAutoFlipOver() {
      const exposedBoy = state.boys.find(b => b.suspicion >= 85);
      if (exposedBoy) {
        SoundFX.play('danger');
        triggerEnding('end_exposed', `因為【${exposedBoy.name}】的懷疑度飆升至 ${exposedBoy.suspicion}%，他私下聯絡了其他男主比對截圖，妳的秘密徹底曝光大翻車！`);
        return true;
      }
      return false;
    }

    // ==========================================
    // Core Game Actions
    // ==========================================
    function answerLineOption(boyId, optIndex) {
      const boy = getBoy(boyId);
      if (!boy || state.answeredToday[boyId]) return;
      const dayIdx = state.day - 1;
      const dlg = DIALOGUES[boyId][dayIdx];
      if (!dlg) return;
      const opt = dlg.options[optIndex];
      if (!opt) return;

      SoundFX.play(opt.sus >= 20 ? 'danger' : 'pop');

      state.chatHistory[boyId].push({ sender: 'me', text: opt.text });
      state.chatHistory[boyId].push({ sender: 'boy', text: opt.reply });

      boy.affection = clamp(boy.affection + opt.aff, 0, 100);
      boy.suspicion = clamp(boy.suspicion + opt.sus, 0, 100);
      if (opt.money) {
        state.money += opt.money;
      }

      state.answeredToday[boyId] = true;

      const deltaText = `好感 ${opt.aff >= 0 ? '+' + opt.aff : opt.aff} / 懷疑 ${opt.sus >= 0 ? '+' + opt.sus : opt.sus}`;
      state.chatHistory[boyId].push({ sender: 'sys', text: `✨ 互動結果：${deltaText}` });

      renderAll();
      checkAutoFlipOver();
    }

    function sendInventoryGiftToBoy(itemIdx, boyId) {
      const item = state.inventory[itemIdx];
      const boy = getBoy(boyId);
      if (!item || !boy) return;

      state.inventory.splice(itemIdx, 1);
      SoundFX.play('coin');

      if (item.targetBoy === boy.id) {
        boy.affection = clamp(boy.affection + item.aff, 0, 100);
        boy.suspicion = clamp(boy.suspicion + item.sus, 0, 100);
        state.chatHistory[boy.id].push({
          sender: 'me',
          text: `🎁 送給了你一份禮物：【${item.name}】`
        });
        state.chatHistory[boy.id].push({
          sender: 'boy',
          text: `「這正是我最喜歡的 ${item.name}！妳怎麼這麼懂我❤️」（好感 +${item.aff}，懷疑 ${item.sus}）`
        });
        showPhoneToast(`🎁 送禮大成功！`, `${boy.name} 超喜歡【${item.name}】，好感大幅提升！`);
      } else {
        // Sent wrong style gift to the wrong guy!
        boy.affection = clamp(boy.affection + 3, 0, 100);
        boy.suspicion = clamp(boy.suspicion + 10, 0, 100);
        state.chatHistory[boy.id].push({
          sender: 'me',
          text: `🎁 送給了你一份禮物：【${item.name}】`
        });
        state.chatHistory[boy.id].push({
          sender: 'boy',
          text: `「謝謝妳的心意……不過這好像不是我的風格，妳是不是買給別人的順便送我？」（好感 +3，懷疑 +10）`
        });
        showPhoneToast(`⚠️ 送錯禮物風格！`, `${boy.name} 覺得這不是他的喜好，懷疑度上升了！`, true);
      }
      renderAll();
      checkAutoFlipOver();
    }

        state.storyHideList.splice(idx, 1);

        state.storyHideList.push(boyId);

      renderPhoneScreen();

    function publishIgStory(presetId) {
      if (state.postedStoryToday) {
        showPhoneToast('📸 今天已經發過限動囉', '一天發太多限時動態容易露餡，明天再發吧！');
        return;
      }
      const preset = IG_STORY_PRESETS.find(p => p.id === presetId);
      if (!preset) return;

      state.postedStoryToday = true;
      state.charm += preset.charmBonus;

      let caughtNames = [];
      let charmedNames = [];

      state.boys.forEach(boy => {
        const isHidden = state.storyHideList.includes(boy.id);
        if (isHidden) return; // Boy cannot see this story!

        if (preset.angryBoys.includes(boy.id)) {
          boy.suspicion = clamp(boy.suspicion + 22, 0, 100);
          boy.affection = clamp(boy.affection - 8, 0, 100);
          caughtNames.push(boy.name);
          state.chatHistory[boy.id].push({
            sender: 'boy',
            text: `「剛剛看到妳的 IG 限時動態【${preset.title}】……妳不是說今天沒空嗎？跟誰在一起？！」（忘記隱藏限動！懷疑度 +22）`
          });
        } else {
          boy.affection = clamp(boy.affection + 8, 0, 100);
          boy.suspicion = clamp(boy.suspicion - 4, 0, 100);
          charmedNames.push(boy.name);
          state.chatHistory[boy.id].push({
            sender: 'boy',
            text: `「剛看到妳的限動，今天狀態超美❤️」（好感 +8，懷疑 -4）`
          });

          '🚨 限時動態忘記隱藏！抓包警告！',

        );

        SoundFX.play('fanfare');

      checkAutoFlipOver();

    function addToCart(itemId) {
      const item = SHOP_ITEMS.find(i => i.id === itemId);
      if (!item) return;
      state.cart.push(item);
      SoundFX.play('pop');
      showPhoneToast('🛒 已加入購物車', `【${item.name}】已放入購物車，可自己結帳或找男主買單！`);
      renderAll();
    }

    function removeFromCart(idx) {
      state.cart.splice(idx, 1);
      SoundFX.play('pop');
      renderAll();
    }

    function checkoutCart(payerId) {
      if (state.cart.length === 0) return;
      const total = state.cart.reduce((sum, i) => sum + i.price, 0);

      if (payerId === 'self') {
        if (state.money < total) {
          SoundFX.play('danger');
          showPhoneToast('💸 小金庫餘額不足！', '錢不夠啦～試著請多金的男主幫妳清空購物車吧！', true);
          return;
        }
        state.money -= total;
        SoundFX.play('coin');
        applyPurchasedItems();
        showPhoneToast('🛍️ 自費結帳成功！', `花費 $${total.toLocaleString()}，商品已送達！`);
      } else {
        const boy = getBoy(payerId);
        if (!boy) return;
        // Check if cart contains a gift specifically for ANOTHER guy
        const hasOtherBoyGift = state.cart.some(i => i.targetBoy !== 'all' && i.targetBoy !== boy.id);
        if (hasOtherBoyGift) {
          boy.suspicion = clamp(boy.suspicion + 28, 0, 100);
          boy.affection = clamp(boy.affection - 12, 0, 100);
          SoundFX.play('danger');
          showPhoneToast(
            `🚨 社死現場！${boy.name} 拒絕買單！`,
            `購物車裡有送給別的男人的禮物，妳居然傳給 ${boy.name} 付錢？！他懷疑度暴增 +28！`,
            true
          );
          renderAll();
          checkAutoFlipOver();
          return;
        }

        if (boy.wealthLevel >= 4 && boy.affection >= 45) {
          boy.affection = clamp(boy.affection + 5, 0, 100);
          SoundFX.play('coin');
          applyPurchasedItems();
          state.chatHistory[boy.id].push({
            sender: 'boy',
            text: `「剛幫妳把購物車 $${total.toLocaleString()} 清空了，喜歡最重要❤️」`
          });
          showPhoneToast(`💳 ${boy.name} 霸氣幫妳買單！`, `省下 $${total.toLocaleString()}，他還覺得妳撒嬌很可愛！`);
        } else if (boy.id === 'puppy') {
          boy.suspicion = clamp(boy.suspicion + 8, 0, 100);
          SoundFX.play('danger');
          showPhoneToast(`🥺 林予樂零用錢不夠…`, `「姊姊對不起，這單 $${total.toLocaleString()} 超出我打工薪水了QQ」`, true);
          return;
        } else {
          boy.suspicion = clamp(boy.suspicion + 10, 0, 100);
          SoundFX.play('danger');
          showPhoneToast(`⚠️ ${boy.name} 委婉拒絕代付`, `目前好感度還不夠高，太常要他買單會讓他起疑喔！`, true);
          renderAll();
          return;
        }
      }
      renderAll();
      checkAutoFlipOver();
    }

    function applyPurchasedItems() {
      state.cart.forEach(item => {
        if (item.targetBoy === 'all') {
          state.charm += item.charm;
          state.boys.forEach(b => {
            b.affection = clamp(b.affection + item.aff, 0, 100);
            b.suspicion = clamp(b.suspicion + item.sus, 0, 100);
          });
        } else {
          state.inventory.push(item);
        }
      });
      state.cart = [];
    }

    function orderFoodDelivery(noteType) {
      const food = FOOD_ITEMS.find(f => f.id === state.selectedFoodId);
      if (!food) return;
      if (state.money < food.price) {
        SoundFX.play('danger');
        showPhoneToast('💸 餘額不足點外送', '錢包不夠付外送費囉！', true);
        return;
      }

      state.money -= food.price;

      if (state.selectedFoodTarget === 'self') {
        SoundFX.play('coin');
        state.charm += 5;
        state.boys.forEach(b => {
          b.suspicion = clamp(b.suspicion - 4, 0, 100);
        });
        showPhoneToast('🛵 外送已送達妳家！', `享用【${food.name}】並拍了居家認證照，全體懷疑度 -4、魅力 +5！`);
        renderAll();
        return;
      }

      const boy = getBoy(state.selectedFoodTarget);
      if (!boy) return;

      if (noteType === 'wrong_name') {
        // Funny trap option: wrote wrong guy's nickname on delivery card
        boy.suspicion = clamp(boy.suspicion + 30, 0, 100);
        boy.affection = clamp(boy.affection - 15, 0, 100);
        SoundFX.play('danger');
        state.chatHistory[boy.id].push({
          sender: 'boy',
          text: `「妳幫我叫的【${food.name}】收到了，但外送單備註寫『給最愛的寶貝其他哥哥』是什麼意思？！」（外送備註翻車！懷疑 +30）`
        });
        showPhoneToast('🚨 外送備註寫錯名字大翻車！', `${boy.name} 看到外送小卡氣炸了，懷疑度 +30！`, true);
      } else {
        const isFav = food.favBoy === boy.id;
        const affGain = isFav ? 16 : 9;
        const susDrop = isFav ? -10 : -5;
        boy.affection = clamp(boy.affection + affGain, 0, 100);
        boy.suspicion = clamp(boy.suspicion + susDrop, 0, 100);
        SoundFX.play('coin');
        state.chatHistory[boy.id].push({
          sender: 'me',
          text: `🛵 幫你叫了外送：【${food.name}】送到 ${boy.location}`
        });
        state.chatHistory[boy.id].push({
          sender: 'boy',
          text: isFav
            ? `「居然是我最愛吃的【${food.name}】！貼心小卡我也收到了，愛妳❤️」（好感 +${affGain}，懷疑 ${susDrop}）`
            : `「收到妳點的外送了，謝謝妳這麼貼心～」（好感 +${affGain}，懷疑 ${susDrop}）`
        });
        showPhoneToast('🛵 暖心外送成功送達！', `${boy.name} 收到【${food.name}】，好感 +${affGain}！`);
      }

      renderAll();
      checkAutoFlipOver();
    }

    function advanceNextDay() {
      if (checkAutoFlipOver()) return;

      if (state.day >= 5) {
        evaluateAndShowEnding();
        return;
      }

      // Check if any guy was completely ignored today
      state.boys.forEach(b => {
        if (!state.answeredToday[b.id]) {
          b.affection = clamp(b.affection - 6, 0, 100);
          b.suspicion = clamp(b.suspicion + 8, 0, 100);
          state.chatHistory[b.id].push({
            sender: 'sys',
            text: `⚠️ 妳整天都沒回他訊息（好感 -6 / 懷疑 +8）`
          });
        }
      });

      if (checkAutoFlipOver()) return;

      state.day += 1;
      state.postedStoryToday = false;
      state.postedThreadToday = false;

      const dayIdx = state.day - 1;
      state.boys.forEach(b => {
        state.answeredToday[b.id] = false;
        state.chatHistory[b.id].push({ sender: 'sys', text: `── 第 ${state.day} 天 ──` });
        if (DIALOGUES[b.id][dayIdx]) {
          state.chatHistory[b.id].push({ sender: 'boy', text: DIALOGUES[b.id][dayIdx].prompt });
        }
      });

      SoundFX.play('pop');
      showPhoneToast(`🌙 進入第 ${state.day} 天`, '六位男主傳來了新的 LINE 訊息，修羅場繼續升級！');
      renderAll();
    }

    // ==========================================
    // 9 Endings Evaluation Logic
    // ==========================================
    function evaluateAndShowEnding() {
      // 1. Check if any guy has Suspicion >= 80 or average suspicion >= 65 -> Ending 1: Exposed!
      const maxSusBoy = [...state.boys].sort((a, b) => b.suspicion - a.suspicion)[0];
      const avgSus = state.boys.reduce((s, b) => s + b.suspicion, 0) / state.boys.length;

      if (maxSusBoy.suspicion >= 80 || avgSus >= 60) {
        triggerEnding(
          'end_exposed',
          `因為【${maxSusBoy.name}】懷疑度高達 ${maxSusBoy.suspicion}%，男主們私下對質發現妳同時劈腿六人，聯合在 IG 與 Threads 發長文公審妳！`
        );
        return;
      }

      // 2. Check Ending 3: All-6 Harem Master! (All 6 boys have Affection >= 72 and Suspicion < 55)
      const highAffBoys = state.boys.filter(b => b.affection >= 72 && b.suspicion < 55);
      if (highAffBoys.length === 6) {
        triggerEnding(
          'end_harem',
          `太神啦！六位男主好感度全部突破 72% 且無人起疑！妳成功達成傳說中的「八爪海后・全員後宮」結局！`
        );
        return;
      }

      // 3. Check if no boy has Affection >= 65 -> Ending 2: Alone!
      const topBoy = [...state.boys].sort((a, b) => b.affection - a.affection)[0];
      if (topBoy.affection < 65) {
        triggerEnding(
          'end_alone',
          `最高好感的【${topBoy.name}】也只有 ${topBoy.affection}%，男主們覺得妳若即若離而紛紛退場，最終沒有跟任何人在一起。`
        );
        return;
      }

      // 4. Solo Route Endings (Endings 4 to 9 based on highest affection male lead)
      const soloMap = {
        ceo: 'end_ceo',
        puppy: 'end_puppy',
        doctor: 'end_doctor',
        rapper: 'end_rapper',
        architect: 'end_architect',
        bartender: 'end_bartender'
      };
      const endingId = soloMap[topBoy.id] || 'end_ceo';
      triggerEnding(
        endingId,
        `在六位男主之中，妳與【${topBoy.name}】的好感度高達 ${topBoy.affection}%（懷疑度僅 ${topBoy.suspicion}%），正式收山與他修成正果！`
      );
    }

      let extraVisual = '';

    // Quick simulation preset so user can also preview any of the 9 endings or play naturally
    function simulateQuickEnding(endingId) {
      if (endingId === 'end_harem') {
        state.boys.forEach(b => { b.affection = 88; b.suspicion = 15; });
        evaluateAndShowEnding();
      } else if (endingId === 'end_alone') {
        state.boys.forEach(b => { b.affection = 35; b.suspicion = 20; });
        evaluateAndShowEnding();
      } else if (endingId === 'end_exposed') {
        state.boys[0].suspicion = 92;
        evaluateAndShowEnding();
      } else {
        const mapBoy = {
          end_ceo: 'ceo',
          end_puppy: 'puppy',
          end_doctor: 'doctor',
          end_rapper: 'rapper',
          end_architect: 'architect',
          end_bartender: 'bartender'
        }[endingId];
        state.boys.forEach(b => {
          b.affection = b.id === mapBoy ? 90 : 45;
          b.suspicion = 15;
        });
        evaluateAndShowEnding();
      }
      renderAll();
    }

    // ==========================================
    // Top-Level Event Listeners
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav-app-btn').forEach(btn => {

          state.currentApp = btn.getAttribute('data-app');
          SoundFX.play('pop');
          renderPhoneScreen();
        });
      });

      document.getElementById('btnNextDay').addEventListener('click', () => {
        advanceNextDay();
      });

      document.getElementById('btnTriggerEndingNow').addEventListener('click', () => {
        evaluateAndShowEnding();
      });

      document.getElementById('btnResetGame').addEventListener('click', () => {
        SoundFX.play('pop');
        initGame();
      });

        document.getElementById('muteIcon').textContent = SoundFX.muted ? '🔇' : '🔊';
